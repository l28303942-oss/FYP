{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block main_class %}auth-layout{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
<div class="auth-wrap">
  <div class="auth-card glass">
    <div class="auth-header">
      <div class="auth-logo"><i class="fa-solid fa-lungs-virus"></i></div>
      <h1>Welcome back</h1>
      <p class="muted">Pulmonary Embolism · Segmentation Console</p>
    </div>
    <form method="post" class="auth-form">
      <label class="field">
        <span>Username</span>
        <input type="text" name="username" required autocomplete="username" placeholder="demo">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <label class="inline-check">
        <input type="checkbox" name="remember" value="1"> Remember me on this device
      </label>
      <button type="submit" class="btn btn-primary btn-block"><span>Sign in</span><i class="fa-solid fa-arrow-right"></i></button>
    </form>
    <p class="auth-switch">No account? <a href="{{ url_for('auth.signup') }}">Create one</a></p>
  </div>
  <div class="auth-side">
    <div class="blob"></div>
    <p class="tagline">TSNet + Attention U-Net · CT intelligence</p>
  </div>
</div>
{% endblock %}
