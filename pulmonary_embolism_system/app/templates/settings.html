{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<section class="page-hero">
  <div>
    <p class="eyebrow">Preferences</p>
    <h1>Settings</h1>
    <p class="muted">Profile, security, theme, notifications</p>
  </div>
</section>

<div class="settings-grid">
  <section class="panel glass">
    <h2><i class="fa-solid fa-id-card"></i> Profile</h2>
    <form method="post" class="stack-form">
      <input type="hidden" name="action" value="profile">
      <label class="field"><span>Username</span><input value="{{ user.username }}" disabled></label>
      <label class="field"><span>Email</span><input type="email" name="email" value="{{ user.email }}" required></label>
      <button type="submit" class="btn btn-primary">Save profile</button>
    </form>
  </section>

  <section class="panel glass">
    <h2><i class="fa-solid fa-lock"></i> Change password</h2>
    <form method="post" class="stack-form">
      <input type="hidden" name="action" value="password">
      <label class="field"><span>Current password</span><input type="password" name="current_password" required autocomplete="current-password"></label>
      <label class="field"><span>New password</span><input type="password" name="new_password" minlength="8" required autocomplete="new-password"></label>
      <label class="field"><span>Confirm new</span><input type="password" name="confirm_password" minlength="8" required autocomplete="new-password"></label>
      <button type="submit" class="btn btn-primary">Update password</button>
    </form>
  </section>

  <section class="panel glass">
    <h2><i class="fa-solid fa-sliders"></i> Experience</h2>
    <form method="post" class="stack-form">
      <input type="hidden" name="action" value="prefs">
      <label class="field"><span>Theme</span>
        <select name="theme" id="themeSelect">
          <option value="light" {% if user.theme == 'light' %}selected{% endif %}>Light</option>
          <option value="dark" {% if user.theme == 'dark' %}selected{% endif %}>Dark</option>
        </select>
      </label>
      <label class="inline-check">
        <input type="checkbox" name="notifications" value="1" {% if user.notifications_enabled %}checked{% endif %}> Enable in-app notifications (toasts)
      </label>
      <button type="submit" class="btn btn-primary">Save preferences</button>
    </form>
    <p class="fine-print muted">Theme also toggles from the sidebar · stored per account</p>
  </section>
</div>
{% endblock %}
